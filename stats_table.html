<!DOCTYPE html>
<html>
<head>
  <title>GCFL Stats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <script defer src="js/load_stats.js"></script>
</head>
<body class="bg-orange-500 text-white">
  <nav class="bg-purple-700 p-4 flex justify-between items-center">
    <div class="text-white text-2xl font-bold">GCFL</div>
    <div class="space-x-4">
      <a href="index.html" class="hover:text-orange-300">Home</a>
      <a href="stats_table.html" class="hover:text-orange-300">Stats</a>
      <a href="live_scores.html" class="hover:text-orange-300">Live Scores</a>
      <a href="https://discord.gg/YOUR_LINK" target="_blank" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded">Discord</a>
    </div>
  </nav>
  <div class="container mx-auto py-10">
    <h1 class="text-4xl font-bold text-center mb-10">GCFL Player Stats</h1>
    <div class="overflow-x-auto">
      <table id="stats-table" class="w-full table-auto text-left bg-white text-black rounded-lg">
        <thead>
          <tr>
            <th class="px-4 py-2">Player</th>
            <th class="px-4 py-2">Team</th>
            <th class="px-4 py-2">TDs</th>
            <th class="px-4 py-2">Yards</th>
            <th class="px-4 py-2">INTs</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</body>
</html>
